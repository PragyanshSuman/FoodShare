# Local development services. Production uses managed Postgres (Neon/Supabase)
# or the same Postgres container on a single VPS — see docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodshare
      POSTGRES_PASSWORD: foodshare
      POSTGRES_DB: foodshare
    ports: ["5433:5432"] # 5433 avoids clashing with a locally installed Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodshare"]
      interval: 5s
      retries: 10
  mail:
    # Catches all outgoing email in dev. UI: http://localhost:8025
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
