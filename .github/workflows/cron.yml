# Free scheduler for serverless deployments (Vercel / Netlify / Cloudflare), where
# no process stays alive to run ENABLE_INTERNAL_CRON. Not needed on a VPS.
# To turn on: repo Settings → Secrets: APP_URL (https://your.domain), CRON_SECRET;
#             Settings → Variables: CRON_ENABLED = true
name: cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    if: vars.CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run sweep and job queue
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -m 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
