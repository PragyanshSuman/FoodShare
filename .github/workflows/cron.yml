# Free scheduler for serverless deployments (Vercel / Netlify / Cloudflare), where
# no process stays alive to run ENABLE_INTERNAL_CRON. Not needed on a VPS.
# Repo secrets: APP_URL (https://your.domain) and CRON_SECRET.
name: cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 120 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron"
